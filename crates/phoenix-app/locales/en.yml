boost.faq.heading: "Boosting FAQ"
boost.faq.q1: "What is a Server Boost?"
boost.faq.a1: "Boosts allow you to support your favorite Servers, by unlocking perks for everyone in them. The more Boosts a server has, the more epic the perks that can be unlocked. See the chart above for more details."
boost.faq.q2: "How do I Boost a server?"
boost.faq.q3: "Can I Boost a Server multiple times?"
boost.faq.a3: "Yes, you can Boost a server as many times as you want! The more Boosts the server gets, the better the perks that will be unlocked."
boost.faq.q4: "Can I continue Boosting a server after it reaches Level 3?"
boost.faq.a4: "Absolutely! Server Boosts are a great way to support your favorite servers. When you Boost a server, you'll be recognized with a special Member List Icon, a Boosting role, and a Profile Badge."
boost.faq.q5: "What are 'additional perks' and how are they different from Levels?"
boost.faq.a5: "Additional Perks are new features you can unlock directly with Boosts, separate from your server's Boost Level. Currently, there are two available: Enhanced Role Styles (which add gradient and holographic effects to roles) and Server Tags (4-character identifiers members can display on their profiles across Discord). Unlike traditional server levels, these perks can be unlocked individually without reaching specific level thresholds."
boost.faq.q6: "How much do the new additional perks cost?"
boost.faq.a6: "Enhanced Role Styles and Server Tags each cost 3 Boosts. If you want both perks, you'll need 6 Boosts total (3 for each perk)."
boost.faq.q7: "Are additional perks replacing the current server level system?"
boost.faq.a7: "No, this supplements the existing level system. All current server level perks (emoji slots, file upload limits, etc.) remain exactly the same. This new system simply gives you additional ways to use your Boosts for targeted perks without affecting your server's level progression."
boost.faq.q8: "Do additional perks use separate Boosts from my server level?"
boost.faq.a8: "Yes, Boosts used for additional perks are dedicated specifically to those perks and don't count toward your server's level progression. Similarly, Boosts allocated to your server level can't be used for additional perks. You'll need separate Boosts for each - so if you want Enhanced Role Styles, you need 3 Boosts just for that perk, plus whatever Boosts you want to maintain your current server level."
boost.faq.q9: "Are additional perks a one-time purchase, or do they require ongoing Boosts?"
boost.faq.a9: "Each additional perk requires an ongoing allocation of its required Boosts to stay active, just like levels. If your server drops below the required number of Boosts, the perk will be disabled until the necessary Boosts are reallocated."

boost.faq.heading: "FAQ sur les boosts"
boost.faq.q1: "Qu'est-ce qu'un boost de serveur ?"
boost.faq.a1: "Les boosts te permettent de soutenir tes serveurs préférés en déverrouillant des avantages pour tous leurs membres. Plus un serveur a de boosts, plus les avantages pouvant être déverrouillés seront fabuleux. Vois le graphique ci-dessus pour plus de détails."
boost.faq.q2: "Comment puis-je booster un serveur ?"
boost.faq.q3: "Puis-je booster un serveur plusieurs fois ?"
boost.faq.a3: "Oui, tu peux booster un serveur autant de fois que tu le souhaites ! Plus le serveur aura de boosts, meilleurs seront les avantages déverrouillés."
boost.faq.q4: "Puis-je continuer à booster un serveur une fois qu'il a atteint le niveau 3 ?"
boost.faq.a4: "Absolument ! Les boosts de serveur sont un bon moyen de soutenir tes serveurs favoris. Lorsque tu boostes un serveur, tu te fais remarquer avec une icône spéciale dans la liste des membres, un rôle de boost, et un badge de profil."
boost.faq.q5: "Que sont les « avantages supplémentaires » et en quoi sont-ils différents des niveaux ?"
boost.faq.a5: "Les avantages supplémentaires sont de nouvelles fonctionnalités que tu peux déverrouiller directement avec les Boosts, séparément du niveau de Boost de tes serveurs. Actuellement, deux avantages sont disponibles : les styles de rôles améliorés (qui ajoutent des effets dégradés et holographiques aux rôles) et les tags de serveur (des identifiants de 4 caractères que les membres peuvent afficher sur leurs profils à travers tout Discord). Contrairement aux niveaux de serveur traditionnels, ces avantages peuvent être déverrouillés individuellement sans atteindre de paliers de niveau spécifiques."
boost.faq.q6: "Combien coûtent les nouveaux avantages supplémentaires ?"
boost.faq.a6: "Les styles de rôles améliorés et les tags de serveur coûtent 3 Boosts chacun. Si tu veux les deux avantages, tu auras donc besoin de 6 Boosts au total (3 pour chaque avantage)."
boost.faq.q7: "Les avantages supplémentaires remplacent-ils le système de niveau actuel du serveur ?"
boost.faq.a7: "Non, cette option vient s'ajouter au système de niveaux déjà existant. Tous les avantages de niveau actuel du serveur (emplacements d'émojis, limites d'upload de fichier, etc.) restent exactement les mêmes. Ce nouveau système te donne simplement des moyens supplémentaires d'utiliser tes Boosts pour des avantages bien précis, sans affecter la progression de niveau de ton serveur."
boost.faq.q8: "Les avantages supplémentaires utilisent-ils des Boosts séparés de mon niveau de serveur ?"
boost.faq.a8: "Oui, les Boosts utilisés pour les avantages supplémentaires sont dédiés spécifiquement à ces avantages et ne comptent pas dans la progression de niveau de ton serveur. De même, les Boosts attribués à tes niveaux de serveur ne peuvent pas être utilisés pour des avantages supplémentaires. Tu auras besoin de Boosts séparés pour chacun d'entre eux : donc, si tu veux profiter des styles de rôles améliorés, tu auras besoin de 3 Boosts juste pour cet avantage, plus autant de Boosts que nécessaire pour conserver ton niveau de serveur actuel."
boost.faq.q9: "Les avantages supplémentaires sont-ils un achat unique, ou nécessitent-ils de dépenser des Boosts en continu ?"
boost.faq.a9: "Pour chaque avantage supplémentaire, tu dois attribuer en continu les Boosts qu'il requiert pour qu'il reste actif, exactement comme les niveaux. Si ton serveur tombe sous la barre du nombre requis de Boosts, l'avantage sera désactivé jusqu'à ce que les Boosts nécessaires soient réattribués."

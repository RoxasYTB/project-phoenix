gs.access.ck_health: "Conditions d'activité du serveur remplies"
gs.access.ck_health_fail: "Conditions d'activité du serveur non remplies"
gs.access.ck_health_desc: "Les statistiques de ta communauté conviennent ! Ton serveur a assez de membres qui viennent régulièrement discuter."
gs.access.ck_health_fail_desc: "Oh oh... Après évaluation, l'activité de ton serveur n'est pas suffisante."
gs.access.ck_engagement: "Ton serveur a besoin de plus de membres qui visitent et discutent chaque semaine."
gs.access.ck_retention: "Ton taux de conservation est trop bas. Essaye d'améliorer l'expérience d'arrivée de tes nouveaux membres."
gs.access.ck_health_details: "Clique ici pour en savoir plus"
gs.access.ck_health_pending_desc: "Les serveurs dans Découverte doivent remplir certaines conditions d'activité. Les calculer prend du temps pour les serveurs les plus récents ou les plus petits, alors repasse voir les résultats dans environ une semaine."
gs.access.ck_health_small: "Nous ne pouvons pas calculer l'activité de ton serveur tant qu'il n'a pas au moins {minMembers} membres. Les serveurs dans Découverte doivent remplir certaines conditions d'activité."
gs.access.hd_visitors: "Augmente le nombre de visiteurs hebdomadaires"
gs.access.hd_visitors_desc: "Un visiteur est une personne qui s'est connectée au serveur et a consulté au moins un salon. Essaie de donner plus de raisons à tes membres de se connecter, en organisant régulièrement des événements pour ta communauté, par exemple."
gs.access.hd_visitors_label: "moyenne des visiteurs hebdomadaires dans ton serveur"
gs.access.hd_communicators: "Augmente le nombre de communicateurs hebdomadaires"
gs.access.hd_communicators_desc: "Un communicateur est une personne qui a discuté (par texte ou en vocal) dans le serveur. Organiser des événements pour ta communauté et lancer des sujets de discussion sont de bonnes façons d'encourager plus de gens à communiquer."
gs.access.hd_communicators_label: "moyenne des communicateurs hebdomadaires dans ton serveur"
gs.access.hd_retention: "Améliorer l'expérience des nouveaux membres"
gs.access.hd_retention_desc: "Les serveurs qui obtiennent plus de 10 nouveaux membres par semaine doivent avoir une conservation de nouveaux membres de 10 %. Au moins 1 nouvelle personne sur 10 doit rester pendant au moins une semaine.\nObserve ton serveur du point de vue d'un nouveau membre. Y a-t-il des aspects qui pourraient perdre ou créer la confusion chez ces nouveaux membres ?"
gs.access.hd_retention_label: "moyenne de conservation des nouveaux membres dans ton serveur"
gs.access.hd_min: "min. requis"
gs.access.hd_desc: "Pour être sûr de ne recommander que des serveurs actifs aux utilisateurs de Discord, les serveurs dans Découverte doivent avoir un niveau d'activité minimum."
gs.access.hd_footnote: "C'est une moyenne mobile calculée sur les 8 dernières semaines, alors les changements peuvent mettre du temps avant d'apparaître. Seuls les utilisateurs qui sont sur Discord depuis plus de 8 semaines sont comptabilisés comme visiteurs ou communicateurs."

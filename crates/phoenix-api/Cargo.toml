[package]
name = "phoenix-api"
version.workspace = true
edition.workspace = true
description = "Discord user-account API client (REST, gateway, cache) for Phoenix"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_repr = "0.1"
bitflags = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "http2"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
flate2 = "1"
base64 = "0.23"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.13"
rand = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
prost = "0.13"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
md-5 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

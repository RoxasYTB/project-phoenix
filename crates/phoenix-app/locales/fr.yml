boot.tip_01: "Choisis entre les thèmes clair et sombre dans les paramètres d’apparence."
boot.tip_02: "Désactive les animations grâce au paramètre de mouvement réduit dans les paramètres d’accessibilité."
boot.tip_03: "Règle la vitesse de la synthèse vocale dans les paramètres d’accessibilité."
boot.tip_04: "Rends les images accessibles à tous. Ajoute une description lors de l’upload."
boot.tip_05: "Crée des rôles aux couleurs plus lisibles dans les paramètres d’accessibilité."
boot.tip_06: "Pas de souris ? Sers-toi du mode Clavier pour te déplacer. {tabHook} pour commencer."
boot.tip_07: "Règle la saturation des couleurs dans les paramètres d’accessibilité."
boot.tip_08: "Accède aux différentes sections de Discord avec {F6Hook}. {tabHook} pour commencer."
boot.tip_09: "Adapte la taille de police du chat dans les paramètres d'accessibilité."
boot.tip_10: "Pas de clavier ? Active le bouton Envoyer un message dans les paramètres d'apparence pour discuter."
boot.tip_11: "Avant de choisir notre nom actuel, Discord a failli s'appeler Bonfire, ou feu de joie, pour rappeler un endroit chaleureux et accueillant."
boot.tip_12: "Avant de choisir notre nom actuel, Discord a failli s'appeler Wyvern. D'accord, nous n'étions pas particulièrement inspirés."
boot.tip_13: "Psst ! En cliquant sur certaines choses dans l'application, il est possible de découvrir tout un tas de références cachées."
boot.tip_14: "Discord a fait ses premiers pas en tant qu'entreprise de jeux vidéo avec un jeu pour mobile intitulé Fates Forever."
boot.tip_15: "La date de création officielle de Discord est le 13 mai 2015."
boot.tip_16: "L'idée de l'abonnement Discord Nitro nous est venue en mangeant nos céréales au petit déj'."
boot.tip_17: "Notre mascotte, Wumpus, avait été créée à l'origine comme un personnage qui n'avait pas d'amis :("
boot.tip_18: "À ses débuts, Discord n'avait que le thème clair de disponible. Le thème sombre n'est arrivé qu'en août 2015."
boot.tip_19: "En des temps bien reculés, Discord n'était accessible que par navigateur web."
boot.tip_20: "Le personnage qui se trouve sur notre page 404 est un hamster robot répondant au doux nom de Nelly."
boot.tip_21: "Il est possible de jouer à notre propre version du jeu Snake sur la page 404 en appuyant sur un bouton <del>secret</del>."
boot.tip_22: "Tu as une toute petite - et nous insistons sur « petite » - chance d'obtenir une sonnerie secrète quand tu appelles quelqu'un. Bonne chance !"
boot.tip_23: "L'ancienne mascotte du programme Partner était incarnée par un elfe appelé Springle. Il a récemment décidé de prendre une retraite bien méritée."
boot.tip_24: "Tu peux utiliser le mode streamer pour masquer tes informations personnelles en streamant."
boot.tip_25: "Tu peux taper /tableflip et /unflip pour pimenter tes messages."
boot.tip_26: "Les caractères comme @, #, ! et * affineront les résultats de Quick Switcher."
boot.tip_27: "Clique sur le nom d'un serveur dans le sélecteur d'émojis pour cacher les émojis de ce serveur."
boot.tip_28: "Survole un GIF et clique sur l'étoile pour l'ajouter à tes favoris."
boot.tip_29: "Le rôle supérieur pour un utilisateur définit la couleur de cet utilisateur."
boot.tip_30: "Une icône de micro rouge indique qu'un administrateur du serveur a rendu cette personne muette."
boot.tip_31: "Tu peux rendre temporairement muet un serveur ou un salon en faisant un clic droit dessus."
boot.tip_32: "Clique sur ton avatar dans le coin inférieur gauche pour définir un statut personnalisé."
boot.tip_33: "Les groupes privés peuvent contenir jusqu'à dix membres."
boot.tip_34: "Clique sur la boussole dans ta liste de serveurs pour trouver de nouveaux serveurs."
boot.tip_35: "Fais glisser des serveurs et dépose-les les uns sur les autres pour créer des dossiers de serveurs."
boot.tip_36: "Tape /gif + n'importe quoi pour trouver un GIF pour ce sujet !"
boot.tip_37: "Partage les jeux auxquels tu joues avec les paramètres d'activité de jeu."
boot.tip_38: "Surligne du texte dans ta barre de discussion pour le mettre en gras, en italique, et plus encore."
boot.tip_39: "Cache les salons muets dans un serveur en faisant un clic droit sur le nom du serveur."
boot.tip_40: "Personnalise l'apparence de Discord dans le menu des paramètres utilisateur."
boot.tip_41: "Relie tes comptes de réseaux sociaux préférés dans les paramètres de connexion."
boot.tip_42: "Tu peux créer des catégories de salons pour grouper et organiser tes salons."
boot.tip_43: "Tu peux rejoindre jusqu'à 100 serveurs, mais grâce à Nitro, il est possible d'en rejoindre jusqu'à 200 !"
boot.tip_44: "Tu peux faire glisser et déposer des fichiers dans Discord pour les mettre en ligne."
boot.tip_45: "Change le volume de chaque participant en faisant un clic droit dessus pendant un appel."
boot.tip_46: "Fais un clic droit pour épingler un message dans un salon ou en MP pour le sauvegarder pour plus tard."
boot.tip_47: "Tape un signe plus devant le nom d'un émoji pour le transformer en réaction."
boot.tip_48: "Tu peux taper /nick pour changer rapidement ton pseudo dans un serveur."
boot.tip_49: "Tu peux taper / pour afficher les commandes de bot et autres commandes intégrées"
boot.tip_50: "Tu peux mettre des {asterisks} autour de ce que tu écris pour le mettre en <b>gras</b>."
boot.tip_51: "{quickSwitcherHook} pour trouver rapidement une conversation ou un salon précédent."
boot.tip_52: "{markUnreadHook} un message pour le marquer comme non lu."
boot.tip_53: "{markServerUnreadHook} pour marquer un serveur entier comme lu."
boot.tip_54: "{navigateUnreadHook} ou {downHook} naviguera entre les salons non lus"
boot.tip_55: "Utilise {keyboardShortcutsHook} pour afficher la liste des raccourcis de clavier."
boot.tip_56: "{messageNewlineHook} pour sauter à la ligne sans envoyer ton message."
boot.tip_57: "Maintenir {shiftHook} tout en cliquant sur un émoji te permet d'envoyer plusieurs émojis."
boot.tip_58: "Tu peux appuyer sur {upHook} pour éditer rapidement ton message le plus récent."
boot.tip_59: "Statistiquement parlant, la majorité des utilisateurs de Discord pensent que l'ananas et la pizza forment le combo de nourriture le plus scandaleux. Nous remercions le lancement de notre fonctionnalité « Sondages » pour ce Fact Discord™."

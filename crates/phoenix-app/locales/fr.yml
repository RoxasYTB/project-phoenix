gs2.am_alert_to: "L'alerte sera envoyée au salon"
gs2.am_timeout: "Exclure temporairement un membre"
gs2.am_timeout_desc: "Empêche temporairement le membre d'envoyer des messages ou de rejoindre un salon vocal."
gs2.am_timeout_for: "Les membres qui utilisent des mots interdits seront exclus pendant"
gs2.am_block_interaction: "Bloquer les interactions du membre"
gs2.am_block_interaction_desc: "Empêche le membre d'interagir sur le serveur tant que son profil contient ces mots."
gs2.am_step_keywords: "Définir tes mots-clés"
gs2.am_step_mentions: "Nombre maximum de mentions uniques par message"
gs2.am_step_detect: "Détecter"
gs2.am_detect_desc: "AutoMod détecte automatiquement ce contenu."
gs2.am_keywords_hint: "Sépare les mots et expressions par une virgule (chien, chat, tigre) ou en insérant un retour à la ligne. Place * au début ou à la fin de chaque mot, ou aux deux, pour obtenir une correspondance partielle."
gs2.am_regex: "Sers-toi des expressions régulières pour activer la correspondance avancée (facultatif)"
gs2.am_regex_hint: "La syntaxe Rust est prise en charge, sans insensibilité à la casse par défaut."
gs2.am_allow: "Autoriser des mots et expressions (facultatif)"

gs.access.hd_min: "min required"
gs.access.hd_desc: "To ensure we're only recommending active servers to Discord users, servers in Discovery are required to have a minimum activity level."
gs.access.hd_footnote: "Calculated as a rolling avg over the past 8 weeks, so changes may take a few weeks to show. Only users who have been on Discord for 8 weeks+ are counted as visitors or communicators."

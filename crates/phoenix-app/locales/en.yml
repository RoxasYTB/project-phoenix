settings.family.tab_family: "My Family"
settings.family.hero_title: "Stay informed about how your teen is using Discord."
settings.family.hero_body: "We built Family Center to provide you with more context on how your teen uses Discord so you can work together on building positive online behaviors."
settings.family.hero_alt: "Mallow and graggle high fiving"
settings.family.f1_t: "Messages stay private"
settings.family.f1_d: "You can see who your teen is talking to, while still respecting their privacy."
settings.family.f2_t: "Transparent sharing"
settings.family.f2_d: "You and your teen see the exact same information, so you're on the same page."
settings.family.f3_t: "Easily connect"
settings.family.f3_d: "Setup is as simple as using your phone to scan the QR code your teen shows you."
settings.family.g1_t: "What connected guardians can see"
settings.family.g1_d: "Our goal is to help you stay informed about your teen's Discord activity so you can have meaningful conversations and support them as they navigate digital spaces. We provide insights into how your teen uses Discord, and your teen sees the same information, to encourage open dialogue. We allow you to see:"
settings.family.g1_i1_t: "New friends"
settings.family.g1_i1_d: "New friends that your teen added or accepted"
settings.family.g1_i2_t: "Servers joined or participated in"
settings.family.g1_i2_d: "Includes servers your teen has recently created, joined, sent messages in, or participated in a voice and video call"
settings.family.g1_i3_t: "Users messaged or called"
settings.family.g1_i3_d: "This includes direct messages and group chats"
settings.family.g1_i4_t: "Total time spent in voice or video"
settings.family.g1_i4_d: "Minutes spent in calls across direct messages group chats, and servers"
settings.family.g1_i5_t: "Total purchases"
settings.family.g1_i5_d: "All purchases your teen made including Shop and subscriptions"
settings.family.g1_i6_t: "Gifts received"
settings.family.g1_i6_d: "All gifts your teen received in the last week, including who sent them and how much they spent"
settings.family.g1_i7_t: "Reports shared by your teen"
settings.family.g1_i7_d: "If they choose to share a report they filed, you'll be notified via email"
settings.family.g2_t: "What guardians can manage"
settings.family.g2_d: "Guardians can set up safeguards to give their teens the best experience on Discord while being safe."
settings.family.g2_i1_t: "Screen Time Limits"
settings.family.g2_i1_d: "Give your teen a break by choosing the hours and days when Discord won't be accessible."
settings.family.g2_i2_t: "Spending cap"
settings.family.g2_i2_d: "Set a monthly budget for your teen's Discord purchases, including shop items, gifting, and more. Does not include subscriptions."
settings.family.g2_i3_t: "Teen Account Settings"
settings.family.g2_i3_d: "You can manage certain settings for your teen's account that they can't edit on their own."
settings.family.g3_t: "What guardians will not see"
settings.family.g3_i1_t: "What your teen writes or says"
settings.family.g3_i1_d: "You will not see the contents of your teens' messages or calls."
settings.family.link_title: "Download the Discord app to connect with your teens!"
settings.family.link_body: "In order to connect with your teen, you'll need to download the Discord app on your phone. You can then complete setup by going to Family Center in user settings. After connecting, you will see high-level information about your teen's activity on Discord."
settings.family.step1_t: "Ask your teen for their QR code"
settings.family.step1_d: "Your teen can find this by going to Family Center in user settings and clicking My Family."
settings.family.step2_t: "Scan the QR code with your Discord app"
settings.family.step2_d: "This will send a connection request to your teen, like magic!"
settings.family.step3_t: "Have your teen accept the connection request"
settings.family.step3_d: "Once they give consent for you to view their activity data, you’re good to go."

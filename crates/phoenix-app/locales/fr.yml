gs2.ecf_all: "Filtrer les messages de tous les membres"
gs2.ecf_all_desc: "Tous les messages seront filtrés pour du contenu média à base d'images sensibles."
gs2.ecf_no_roles: "Filtrer les messages des membres du serveur sans rôles"

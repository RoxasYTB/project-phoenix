boot.tip_01: "Pick light or dark theme in Appearance Settings."
boot.tip_02: "Turn off animations with Reduced Motion in Accessibility Settings."
boot.tip_03: "Change Text-to-Speech speed in Accessibility Settings."
boot.tip_04: "Make images accessible to everyone. Add a description on upload."
boot.tip_05: "Make roles with unique colors easier to read in Accessibility Settings."
boot.tip_06: "No mouse? Use Keyboard Mode to get around. {tabHook} to get started."
boot.tip_07: "Adjust color saturation in Accessibility Settings."
boot.tip_08: "Jump to different sections of Discord with {F6Hook}. {tabHook} to get started."
boot.tip_09: "Scale chat font size in Accessibility Settings."
boot.tip_10: "No keyboard? Enable the Send Message button in Appearance Settings to chat."
boot.tip_11: "Discord was almost called Bonfire before we picked our name. It was meant to be nice and cozy."
boot.tip_12: "Discord was almost called Wyvern before we picked our name. Not too proud of that one."
boot.tip_13: "There are a bunch of hidden \"Easter Eggs\" in the app that happen when you click certain things..."
boot.tip_14: "Discord started as a game company making a mobile game called Fates Forever."
boot.tip_15: "Discord’s official birthday is May 13, 2015."
boot.tip_16: "We came up with the idea of Discord Nitro over morning breakfast potatoes."
boot.tip_17: "Our mascot, Wumpus, was originally created as a character with no friends :("
boot.tip_18: "In Discord's early days, light theme was the only theme. Dark theme didn't arrive until August 2015."
boot.tip_19: "In the ancient days, Discord started as a browser-only app."
boot.tip_20: "The character on our 404 page is a robot hamster named Nelly."
boot.tip_21: "You can play our version of the Snake game on our 404 page by pressing a <del>secret</del> button."
boot.tip_22: "There's a very small—and we mean small—chance you can get a secret ringtone when calling someone. Good luck!"
boot.tip_23: "Our old Partner mascot was an elf named Springle. He recently retired."
boot.tip_24: "You can use Streamer Mode to hide personal details while streaming."
boot.tip_25: "You can type /tableflip and /unflip to spice up your messages."
boot.tip_26: "Characters like @, #, !, and * will narrow Quick Switcher results."
boot.tip_27: "Click a server name in the emoji picker to hide that server's emoji."
boot.tip_28: "Hover a GIF and click the star to save it to your favorites."
boot.tip_29: "The top-most role for a user defines that user's color."
boot.tip_30: "A red mic icon means that person has been muted by a server admin."
boot.tip_31: "You can temporarily mute a server or channel by right-clicking it."
boot.tip_32: "Click your avatar in the lower-left corner to set a custom status."
boot.tip_33: "Group DMs can have up to ten members."
boot.tip_34: "Click the compass in your server list to find new servers."
boot.tip_35: "Drag and drop servers on top of each other to create server folders."
boot.tip_36: "Type /gif + anything to find a GIF for that topic!"
boot.tip_37: "Share what you're playing by using the Game Activity settings."
boot.tip_38: "Highlight text in your chat bar to bold, use italics, and more."
boot.tip_39: "Hide muted channels in a server by right clicking the server name."
boot.tip_40: "Customize Discord's appearance in the user settings menu."
boot.tip_41: "Link your favorite social media accounts in the connections settings."
boot.tip_42: "You can create channel categories to group and organize your channels."
boot.tip_43: "You can join up to 100 servers, and up to 200 with Nitro!"
boot.tip_44: "You can drag and drop files onto Discord to upload them."
boot.tip_45: "Change each participant's volume by right-clicking them in a call."
boot.tip_46: "Right click to pin messages in a channel or DM to save them for later."
boot.tip_47: "Type a plus sign before an emoji name to turn it into a reaction."
boot.tip_48: "You can type /nick to quickly change your nickname in a server."
boot.tip_49: "You can type / to view bot commands and other built-in commands"
boot.tip_50: "You can type {asterisks} around your words to make them <b>bold</b>."
boot.tip_51: "{quickSwitcherHook} to quickly find a previous conversation or channel."
boot.tip_52: "{markUnreadHook} a message to mark it as unread."
boot.tip_53: "{markServerUnreadHook} to mark an entire server as read."
boot.tip_54: "{navigateUnreadHook} or {downHook} will navigate between unread channels"
boot.tip_55: "Use {keyboardShortcutsHook} to bring up the list of keyboard shortcuts."
boot.tip_56: "{messageNewlineHook} to make a new line without sending your message."
boot.tip_57: "Holding {shiftHook} while clicking emoji allows you to send multiple emoji."
boot.tip_58: "You can press {upHook} to quickly edit your most recent message."
boot.tip_59: "Statistically speaking, the majority of Discord users believe that pineapple and pizza is the most cursed food combo. Thank our Polls feature launch for this Discord Fact™."

settings.family.hero_title: "Restez informé(e) sur la façon dont votre ado utilise Discord."
settings.family.hero_body: "Nous avons créé le centre familial pour t'éclairer davantage sur la façon dont ton ado utilise Discord. Vous pourrez ainsi développer ensemble des comportements positifs sur Internet."
settings.family.hero_alt: "Mallow et Graggle qui topent dans leurs mains"
settings.family.f1_t: "Des messages qui restent privés"
settings.family.f1_d: "Vous pouvez voir les personnes avec qui votre ado discute tout en respectant sa vie privée."
settings.family.f2_t: "Un partage transparent"
settings.family.f2_d: "Votre ado et vous voyez les mêmes informations, ce qui fait que vous êtes sur la même longueur d'onde."
settings.family.f3_t: "Une connexion simple comme bonjour"
settings.family.f3_d: "Il vous suffit d'utiliser votre téléphone pour scanner le code QR de votre ado."
settings.family.g1_t: "Ce que les tuteurs connectés peuvent voir"
settings.family.g1_d: "Notre objectif est de vous permettre de rester informé de l'Activité Discord de votre adolescent(e) afin que vous puissiez avoir d'importantes conversations significatives et le ou la soutenir lorsqu'il ou elle navigue dans les espaces numériques. Nous vous fournissons des informations sur la façon dont votre ado utilise Discord, et votre adolescent voit aussi les mêmes informations, afin d'encourager un dialogue ouvert. Nous vous permettons de voir les informations suivantes :"
settings.family.g1_i1_t: "Nouveaux amis"
settings.family.g1_i1_d: "Nouveaux amis ajoutés ou acceptés par votre ado"
settings.family.g1_i2_t: "Serveurs rejoints et serveurs actifs"
settings.family.g1_i2_d: "Inclut les serveurs que votre adolescent a récemment créés ou rejoints, et dans lesquels il ou elle a envoyé des messages ou participé à un appel vocal ou vidéo"
settings.family.g1_i3_t: "Utilisateurs contactés par message ou appelés"
settings.family.g1_i3_d: "Cela inclut les messages privés et les groupes de discussion"
settings.family.g1_i4_t: "Temps total passé en vocal ou vidéo"
settings.family.g1_i4_d: "Minutes passées dans des appels dans les messages privés, les groupes de discussion et les serveurs"
settings.family.g1_i5_t: "Total des achats"
settings.family.g1_i5_d: "Tous les achats effectués par votre ado, y compris ceux effectués dans la Boutique et les abonnements."
settings.family.g1_i6_t: "Cadeaux reçus"
settings.family.g1_i6_d: "Tous les cadeaux que votre adolescent(e) a reçus au cours des sept derniers jours, y compris les personnes qui les ont envoyés et combien elles ont dépensé."
settings.family.g1_i7_t: "Rapports partagés par votre ado"
settings.family.g1_i7_d: "S'il ou elle décide de partager un signalement qu'il ou elle a déposé, vous en serez notifié(e) par e-mail."
settings.family.g2_t: "Ce que les tuteurs peuvent gérer"
settings.family.g2_d: "Les tuteurs peuvent configurer des protections afin d'offrir à leurs adolescent(e)s la meilleure expérience sur Discord tout en assurant leur sécurité."
settings.family.g2_i1_t: "Limites de temps d'écran"
settings.family.g2_i1_d: "Forcez votre adolescent à prendre une pause en choisissant les heures et les jours où Discord ne sera pas accessible."
settings.family.g2_i2_t: "Plafond de dépenses"
settings.family.g2_i2_d: "Définisez un budget mensuel pour les achats Discord de votre adolescent(e), y compris les articles de la Boutique, les cadeaux et plus encore. N'inclut pas les abonnements."
settings.family.g2_i3_t: "Paramètres du compte adolescent"
settings.family.g2_i3_d: "Vous pouvez gérer certains paramètres pour le compte de votre ado qu'il ou elle ne peut pas modifier par lui-même ou elle-même."
settings.family.g3_t: "Ce que les tuteurs ne verront pas"

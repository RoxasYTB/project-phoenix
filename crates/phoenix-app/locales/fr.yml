gs2.activity_alerts: "Alertes d'activité"
gs2.activity_alerts_desc: "Reçois des notifications pour les activités de messages privés ou de connexions qui dépassent les chiffres habituels de ton serveur."
gs2.safety_channel: "Salon de notifications de sécurité"
gs2.safety_channel_hint: "Tous les utilisateurs ayant accès à ce salon textuel pourront voir les notifications."
gs2.safety_channel_desc: "C'est le salon où Discord enverra les mises à jour de sécurité importantes concernant ton serveur. Nous te recommandons de choisir un salon dont l'accès est plus restreint, car certaines informations peuvent être sensibles."
gs2.captcha_suspicious: "Faire passer une vérification CAPTCHA aux comptes suspects avant qu'ils ne puissent rejoindre"
gs2.captcha_raid: "Faire passer une vérification CAPTCHA aux comptes souhaitant rejoindre en cas de suspicion de raid"
gs2.verification: "Niveau de vérification"
gs2.verification_desc: "Les membres du serveur doivent remplir les critères suivants avant de pouvoir envoyer des messages. Si un membre a un rôle attribué et que le processus d'accueil au serveur n'est pas activé, cela ne s'applique pas."
gs2.verification_modal_desc: "Les membres du serveur doivent remplir les critères suivants avant de pouvoir envoyer des messages dans les salons textuels ou lancer une conversation en message privé. Si un membre a un rôle attribué et que le processus d'accueil au serveur n'est pas activé, cela ne s'applique pas. "
gs2.verification_modal_reco: "Pour un serveur de communauté, nous recommandons de définir un niveau de vérification."
gs2.vl_none: "Aucun"
gs2.vl_low: "Faible"
gs2.vl_low_desc: "Doit avoir une adresse e-mail vérifiée sur son compte Discord."
gs2.vl_medium: "Moyen"
gs2.vl_medium_desc: "Doit aussi être inscrit sur Discord depuis plus de 5 minutes."
gs2.vl_high: "Élevé"
gs2.vl_high_desc: "Doit aussi être un membre de ce serveur depuis plus de 10 minutes."
gs2.vl_highest: "Maximum"
gs2.vl_highest_desc: "Doit avoir un numéro de téléphone vérifié sur son compte Discord."
gs2.dm_hide: "Masquer les MP des utilisateurs suspects"
gs2.dm_hide_desc: "Envoie les MP suspects dans un dossier de spams à part. Les membres peuvent signaler une escroquerie ou déplacer les messages dans la boîte de réception."
gs2.dm_filter: "Filtrer les MP des utilisateurs inconnus"
gs2.dm_filter_desc: "Filtre les MP des utilisateurs inconnus vers la boîte de réception des demandes de message. Les membres doivent approuver la demande avant de pouvoir y répondre."
gs2.links_warn: "Préviens les membres avant qu'ils ne se rendent sur les liens externes"
gs2.spam_delete: "Masquer tous les messages des spammeurs présumés et supprimer ces derniers"
gs2.mfa: "Exiger une A2F pour les actions des modérateurs"
gs2.mfa_desc: "Les modérateurs doivent obligatoirement activer l'authentification à deux facteurs pour pouvoir bannir, expulser ou exclure temporairement des membres, ainsi que pour effacer des messages."
gs2.prune_admin: "Limiter le congédiement des membres aux admins"
gs2.prune_admin_desc: "Seuls les administrateurs et administratrices et le ou la propriétaire du serveur peuvent congédier les membres inactifs lorsque ce paramètre est activé."
gs2.risky: "Supprime les permissions risquées de @everyone"
gs2.risky_desc: "@everyone a actuellement {n} permissions risquées activées"
gs2.automod_lead: "Maintiens ton serveur sûr tout en laissant tes modérateurs se reposer ! Configure des filtres de modération de contenu et programme une réponse personnalisée. AutoMod se chargera du reste."

boost.unavailable_tip: "Tu ne peux pas acheter de Boosts tant que tu es membre d'un abonnement {name}."
boost.faq.a2: "Tu peux booster ce serveur directement sur cette page ! Si tu souhaites booster un serveur différent, tu trouveras les instructions détaillées dans notre centre d'aide."

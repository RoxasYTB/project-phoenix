gs.access.ex2_body: "Pas de spam ni d'autopromotion (invitations de serveurs, publicités, etc.) sans l'autorisation d'un modérateur du serveur, y compris via les MP envoyés aux autres membres."
gs.access.ex3: "Pas de contenu obscène ou soumis à une limite d'âge"
gs.access.ex3_body: "Pas de contenu obscène ou soumis à une limite d'âge, qu'il s'agisse de texte, d'images ou de liens mettant en scène de la nudité, du sexe, de l'hyperviolence ou tout autre contenu explicite perturbant."
gs.access.ex4: "Aidez à créer un environnement sain"
gs.access.ex4_body: "Si tu remarques quelque chose de contraire aux règles ou qui te rend mal à l'aise, informes-en les modérateurs. Nous voulons que ce serveur soit accueillant pour tout le monde !"
